name = "sarah-ai-trading"
main = "src/index.js"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sarah-ai-db"
database_id = "YOUR_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"