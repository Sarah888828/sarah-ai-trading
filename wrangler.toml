name = "sarah-ai-trading"
main = "src/index.js"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sarah-ai-db"
database_id = "YOUR_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"

# Durable Objects (24/7 백테스팅 엔진 + 상태 캐싱)
[[durable_objects.bindings]]
name = "TRADING_DO"
class_name = "TradingDO"

[[migrations]]
tag = "v1"
new_classes = ["TradingDO"]