<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sarah.ai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,10,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:100}
.logo{font-weight:700;font-size:17px;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav a{padding:7px 12px;border-radius:8px;font-size:13px;color:#94a3b8;text-decoration:none;cursor:pointer}
.nav a:hover{color:#f1f5f9;background:rgba(255,255,255,0.04)}
.nav a.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(139,92,246,0.2));border:1px solid rgba(99,102,241,0.3)}
.main{margin-top:72px;padding:0 20px 40px;max-width:1100px;margin-left:auto;margin-right:auto}
.tab{display:none}
.tab.active{display:block}
.card{border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.cl{font-size:11px;color:#64748b;margin-bottom:4px}
.cv{font-size:22px;font-weight:700}
.cv.p{color:#06b6d4}
.cv.l{color:#f43f5e}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.04)}
th{color:#64748b;font-weight:500;font-size:11px}
td.p{color:#06b6d4}
td.l{color:#f43f5e}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge.buy{background:rgba(6,182,212,0.15);color:#06b6d4}
.badge.sell{background:rgba(244,63,94,0.15);color:#f43f5e}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sn{padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03)}
.sn .n{font-weight:600;font-size:14px;margin-bottom:4px}
.sn .c{color:#64748b;font-size:11px;margin-bottom:6px}
.sn .d{color:#94a3b8;font-size:12px}
.lv{background:rgba(0,0,0,0.3);border-radius:8px;padding:12px;max-height:400px;overflow-y:auto;font-family:monospace;font-size:12px}
.ll{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
.lt{color:#64748b;margin-right:8px}
.ov{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.ov.h{opacity:0;pointer-events:none}
.sp{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,0.05);border-top-color:#6366f1;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.g4,.g3,.sg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="ov" id="ov"><div class="sp"></div></div>

<nav class="nav">
  <div class="logo">Sarah.ai</div>
  <div>
    <a href="#" data-tab="summary" class="active">📊 AI 요약</a>
    <a href="#" data-tab="portfolio">📦 포트폴리오</a>
    <a href="#" data-tab="strategies">🧠 전략</a>
    <a href="#" data-tab="backtest">📈 백테스팅</a>
    <a href="#" data-tab="settings">⚙️ 설정</a>
  </div>
</nav>

<div class="main">

<div class="tab active" id="summary">
<div class="g4">
<div class="card"><div class="cl">총 자산</div><div class="cv" id="tv">-</div></div>
<div class="card"><div class="cl">투자 금액</div><div class="cv" id="iv">-</div></div>
<div class="card"><div class="cl">가용 금액</div><div class="cv" id="av">-</div></div>
<div class="card"><div class="cl">수익률</div><div class="cv" id="pv">-</div></div>
</div>
<div class="card" style="padding:24px;text-align:center;color:#64748b;font-size:14px">
AI 분석 대시보드입니다.<br>실시간 데이터가 표시됩니다.
</div>
</div>

<div class="tab" id="portfolio">
<div class="card" style="margin-bottom:16px">
<div style="font-size:14px;font-weight:600;margin-bottom:12px">보유 종목</div>
<table><thead><tr><th>종목</th><th>매입가</th><th>수량</th><th>투자액</th><th>현재가</th><th>수익률</th><th>매입일</th></tr></thead><tbody id="pb"></tbody></table>
</div>
<div class="card">
<div style="font-size:14px;font-weight:600;margin-bottom:12px">최근 거래</div>
<table><thead><tr><th>구분</th><th>종목</th><th>가격</th><th>수량</th><th>금액</th><th>수익률</th><th>일자</th></tr></thead><tbody id="tb"></tbody></table>
</div>
</div>

<div class="tab" id="strategies">
<div class="sg" id="sg"></div>
</div>

<div class="tab" id="backtest">
<div class="card">
<div style="font-size:14px;font-weight:600;margin-bottom:12px">백테스팅 결과</div>
<table><thead><tr><th>#</th><th>전략</th><th>수익률</th><th>승률</th><th>MDD</th><th>Profit Factor</th><th>총 거래</th></tr></thead><tbody id="bb"></tbody></table>
</div>
</div>

<div class="tab" id="settings">
<div class="card">
<div style="font-size:14px;font-weight:600;margin-bottom:12px">시스템 로그</div>
<div class="lv" id="lc"></div>
</div>
</div>

</div>
<script>
(function(){
var R=10000;
var C='summary';

function getTabFromHash(){
var h=window.location.hash.replace('#/','');
if(!h||!document.getElementById(h)) return 'summary';
return h;
}

function sw(id){
C=id;
window.location.hash='#/'+id;
var t=document.querySelectorAll('.tab');
for(var i=0;i<t.length;i++){t[i].classList.remove('active');}
var x=document.getElementById(id);
if(x){x.classList.add('active');}
var l=document.querySelectorAll('.nav a');
for(var i=0;i<l.length;i++){l[i].classList.remove('active');}
var a=document.querySelector('.nav a[data-tab="'+id+'"]');
if(a){a.classList.add('active');}
ld(id);
}

function ld(id){
if(id==='summary'){
Promise.all([
fetch('/api/status').then(function(r){return r.json()})['catch'](function(){return null}),
fetch('/api/account').then(function(r){return r.json()})['catch'](function(){return null})
]).then(function(r){
if(r[1]){
var a=r[1];
st('tv',(a.total_balance||0).toLocaleString()+'원');
st('iv',(a.invested||0).toLocaleString()+'원');
st('av',(a.available||0).toLocaleString()+'원');
var p=a.total_profit_rate||0;
var e=document.getElementById('pv');
if(e){e.textContent=(p>=0?'+':'')+p.toFixed(2)+'%';e.className='cv '+(p>=0?'p':'l');}
}
});
}else if(id==='portfolio'){
Promise.all([
fetch('/api/positions').then(function(r){return r.json()})['catch'](function(){return null}),
fetch('/api/trades').then(function(r){return r.json()})['catch'](function(){return null})
]).then(function(r){
var pb=document.getElementById('pb');
if(pb&&r[0]&&r[0].positions){
var h='';
for(var i=0;i<r[0].positions.length;i++){
var p=r[0].positions[i];
var pr=p.profit_rate||0;
h+='<tr><td>'+(p.stock_name||p.stock_code)+'</td><td>'+(p.buy_price||0).toLocaleString()+'</td><td>'+(p.quantity||0)+'</td><td>'+(p.invested||0).toLocaleString()+'</td><td>'+(p.current_price||0).toLocaleString()+'</td><td class="'+(pr>=0?'p':'l')+'">'+(pr>=0?'+':'')+pr.toFixed(2)+'%</td><td>'+(p.buy_date||'')+'</td></tr>';
}
pb.innerHTML=h||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#666">보유 종목 없음</td></tr>';
}
var tb=document.getElementById('tb');
if(tb&&r[1]&&r[1].trades){
var h='';
for(var i=0;i<r[1].trades.length;i++){
var t=r[1].trades[i];
h+='<tr><td><span class="badge '+(t.type==='buy'?'buy':'sell')+'">'+(t.type==='buy'?'매수':'매도')+'</span></td><td>'+(t.stock_name||t.stock_code)+'</td><td>'+(t.price||0).toLocaleString()+'</td><td>'+(t.quantity||0)+'</td><td>'+(t.amount||0).toLocaleString()+'</td><td>'+(t.profit_rate!=null?(t.profit_rate>=0?'+':'')+t.profit_rate.toFixed(2)+'%':'-')+'</td><td>'+(t.date||'')+'</td></tr>';
}
tb.innerHTML=h||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#666">거래 내역 없음</td></tr>';
}
});
}else if(id==='strategies'){
fetch('/api/strategies').then(function(r){return r.json()})['catch'](function(){return null}).then(function(d){
var g=document.getElementById('sg');
if(g&&d&&d.strategies){
var h='';
for(var i=0;i<d.strategies.length;i++){
var s=d.strategies[i];
h+='<div class="sn"><div class="n">'+s.name+'</div><div class="c">'+(s.category||'')+'</div><div class="d">'+(s.description||'').substring(0,80)+'</div></div>';
}
g.innerHTML=h;
}
});
}else if(id==='backtest'){
fetch('/api/backtest/run_all').then(function(r){return r.json()})['catch'](function(){return null}).then(function(d){
var b=document.getElementById('bb');
if(b&&d&&d.results){
var h='';
for(var i=0;i<d.results.length;i++){
var r=d.results[i];
var s=(r.result&&r.result.summary)?r.result.summary:{};
var rt=s.total_return||0;
h+='<tr><td>'+(i+1)+'</td><td>'+r.name+'</td><td class="'+(rt>=0?'p':'l')+'">'+(rt>=0?'+':'')+rt.toFixed(2)+'%</td><td>'+(s.win_rate||0).toFixed(1)+'%</td><td class="l">'+(s.max_drawdown||0).toFixed(1)+'%</td><td>'+(s.profit_factor||0).toFixed(2)+'</td><td>'+(s.total_trades||0)+'</td></tr>';
}
b.innerHTML=h||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#666">결과 없음</td></tr>';
}
});
}else if(id==='settings'){
fetch('/api/logs').then(function(r){return r.json()})['catch'](function(){return null}).then(function(d){
var l=document.getElementById('lc');
if(l&&d&&d.logs){
var h='';
var items=d.logs.slice(-30);
for(var i=0;i<items.length;i++){
h+='<div class="ll"><span class="lt">['+(items[i].time||'')+']</span>'+(items[i].message||'')+'</div>';
}
l.innerHTML=h;
}
});
}
}

function st(id,t){var e=document.getElementById(id);if(e){e.textContent=t;}}

document.addEventListener('DOMContentLoaded',function(){
setTimeout(function(){document.getElementById('ov').classList.add('h');},800);
var l=document.querySelectorAll('.nav a');
for(var i=0;i<l.length;i++){
l[i].addEventListener('click',function(e){
e.preventDefault();
sw(this.getAttribute('data-tab'));
});
}
// Hash change listener
window.addEventListener('hashchange',function(){
var id=getTabFromHash();
sw(id);
});
// Initial load from hash
var initTab=getTabFromHash();
sw(initTab);
setInterval(function(){ld(C);},R);
});
})();
</script>
</body>
</html>
